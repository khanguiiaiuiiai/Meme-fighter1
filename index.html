<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEME FIGHTER</title>
<style>
:root{--bg:#161033;--bg2:#3b1a6b;--ink:#fff;--y:#ffe14d;--p:#ff4fa3;--c:#35e0ff;--gold:#e0b878;--card:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
#menu{background:radial-gradient(circle at 30% 20%,var(--bg2),var(--bg))}
#menu::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,255,255,.04) 22px 44px)}
.av{position:absolute;left:14px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;z-index:2}
.avc{width:56px;height:56px;border-radius:50%;background:var(--card);border:3px solid var(--y);display:grid;place-items:center;font-size:28px}
.av b{display:block;font-size:15px}.av small{opacity:.9}
.date{position:absolute;top:calc(72px + env(safe-area-inset-top,0px));left:16px;font-size:11px;opacity:.7;z-index:2}
.lc{position:absolute;left:14px;top:calc(92px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;z-index:2}
.ic{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--gold);background:none;border:0;padding:0}
.ic i{width:50px;height:50px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(#3a6fb5,#1f3a73);display:grid;place-items:center;font-style:normal;font-size:24px}
.rp{position:absolute;right:0;top:calc(8px + env(safe-area-inset-top,0px));width:min(46vw,330px);z-index:2;display:flex;flex-direction:column;gap:8px;padding-right:12px}
.ev{padding:16px;font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--p),#ff9a3c);border:4px solid #000;border-radius:14px;box-shadow:0 5px 0 #000}
.tr{display:flex;border:3px solid var(--c);border-radius:0 0 0 22px;overflow:hidden;background:var(--card)}
.tr button{flex:1;background:none;border:0;font-weight:700;padding:12px 6px;font-size:14px}
.tr button+button{border-left:3px solid var(--c)}
.logo{position:absolute;left:0;right:0;top:14%;text-align:center;z-index:1;pointer-events:none}
.logo h1{margin:0;font-size:clamp(30px,7vw,64px);color:var(--y);text-shadow:4px 4px 0 var(--p),8px 8px 0 #0006;transform:rotate(-3deg)}
.prev{display:flex;justify-content:center;gap:clamp(30px,10vw,120px);margin-top:14px}
.prev i{width:clamp(40px,7vw,62px);aspect-ratio:1;border:4px solid #000;animation:bob 1.2s ease-in-out infinite}
.prev i:nth-child(1){background:var(--c)}.prev i:nth-child(2){background:var(--p);animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-14px) rotate(6deg)}}
.bot{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-end;gap:14px;z-index:2}
.sw{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:3px}
.sw button{width:66px;height:66px;border-radius:50%;border:4px solid #fff;background:var(--card);font-size:30px}
.rk{display:flex;flex-direction:column;align-items:center}
.badge{width:42px;height:46px;background:var(--y);color:#000;font-weight:900;font-size:22px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 20%,100% 70%,50% 100%,0 70%,0 20%)}
.rk button{min-width:min(50vw,320px);padding:12px 24px;font-size:clamp(24px,5vw,36px);font-weight:900;letter-spacing:4px;color:#000;background:linear-gradient(var(--y),#ffb300);border:4px solid #000;border-radius:26px 26px 6px 26px;box-shadow:0 6px 0 #000}
.rk button:active,.sw button:active,.ev:active{transform:translateY(4px)}
.btn{font-weight:700;background:var(--card);border:3px solid var(--c);border-radius:14px;padding:10px 16px}
.btn.big{background:linear-gradient(var(--y),#ffb300);color:#000;border:3px solid #000;font-weight:900;font-size:18px}
.modal{position:absolute;inset:0;background:#000b;display:none;place-items:center;z-index:30}.modal.on{display:grid}
.box{background:var(--bg2);border:4px solid var(--y);border-radius:18px;padding:16px;max-width:92vw;text-align:center}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.cards button{background:var(--card);border:3px solid var(--c);border-radius:14px;padding:10px;min-width:110px;font-weight:700}.cards b{display:block;font-size:32px}
/* panels */
#pnl,#pick{background:linear-gradient(var(--bg2),var(--bg));display:none;flex-direction:column}
#pnl.on,#pick.on{display:flex}
.hd{display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:#0005;border-bottom:3px solid var(--gold)}
.hd b{font-size:18px;flex:1}.hd small{opacity:.9}
#pb,#pGrid{flex:1;overflow:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{padding:6px 12px;border-radius:20px;border:2px solid var(--gold);background:none;font-size:13px}.tabs button.on{background:var(--gold);color:#000}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rl{font-weight:700;color:var(--gold);margin:8px 0 4px}
.hc{width:96px;padding:8px 4px;border-radius:14px;border:3px solid var(--gold);background:radial-gradient(#3a5fa5,#1b2a5a);font-size:12px;font-weight:700}
.hc b{display:block;font-size:30px}.hc small{display:block;font-weight:400;opacity:.85}
.hc.lk{filter:grayscale(1) brightness(.6)}.hc.sel{border-color:var(--y);box-shadow:0 0 12px var(--y)}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.slot{width:64px;height:64px;border-radius:12px;border:3px dashed var(--gold);display:grid;place-items:center;font-size:30px;background:#0004}
.gem{width:80px;height:80px;border-radius:50%;border:4px solid var(--gold);display:grid;place-items:center;font-size:38px;background:radial-gradient(#2b4f95,#14224a)}
.pbar{height:12px;background:#0007;border-radius:8px;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:var(--c)}
.ms{background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.ms>div{flex:1}
.gres{font-size:44px;text-align:center;padding:18px;background:#0005;border:3px solid var(--y);border-radius:16px;margin:12px 0;min-height:100px}
.sm{font-size:12px;opacity:.8}
.pf{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#0006;border-top:3px solid var(--gold);font-weight:700}
/* game */
#game{background:#000;touch-action:none}
#ctl button[data-k^=s]{font-size:10px;line-height:1.05;padding:2px;text-align:center}
#stage{position:absolute;left:50%;top:50%;transform-origin:0 0}
canvas{display:block;width:800px;height:450px;background:#000;touch-action:none}
#ctl{position:absolute;inset:0;pointer-events:none;z-index:3}
#ctl button{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:3px solid #fff;background:#0008;font:700 13px inherit;font-family:inherit;display:grid;place-items:center;padding:0;opacity:.9}
#ctl button.on{background:var(--p)}
.cd{position:absolute;inset:0;border-radius:50%;background:#000a;display:none}
#pause{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:4;padding:4px 14px;background:#0008;border:2px solid #fff;border-radius:12px}
#ult{position:absolute;inset:0;z-index:5;display:none;place-items:center;pointer-events:none;overflow:hidden;background:radial-gradient(circle,#ffe14d00 20%,#ff4fa399)}
#ult.on{display:grid;animation:fl .15s 8 alternate}
#ult div{font-size:clamp(34px,10vw,96px);font-weight:900;color:#fff;-webkit-text-stroke:3px #000;text-shadow:6px 6px 0 var(--p);text-align:center;animation:zm 1.3s both}
#ult small{display:block;font-size:.35em;color:var(--y)}
@keyframes zm{0%{transform:scale(6) rotate(-20deg);opacity:0}25%{transform:scale(1) rotate(-6deg);opacity:1}100%{transform:scale(1.25) rotate(-3deg)}}
@keyframes fl{to{background-color:#fff3}}
#rot{position:absolute;inset:0;background:var(--bg);z-index:20;display:none;place-items:center;text-align:center;font-size:20px}
@media (orientation:portrait){#game.on~#rot{display:grid}}

:root{--l:calc(env(safe-area-inset-left,0px) + 6vw);--r:calc(env(safe-area-inset-right,0px) + 5vw);--b:calc(env(safe-area-inset-bottom,0px) + 8vh)}
#ctl button[data-k=s4]{display:none;animation:gl .8s infinite;border-color:#ffe14d;background:#a3258f;font-size:12px}
#ctl button[data-k=dg],#ctl button[data-k=gd]{font-size:22px}
@keyframes gl{50%{box-shadow:0 0 22px 8px #ffe14d}}
#snd{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:calc(50% + 44px);z-index:4;padding:4px 10px;background:#0008;border:2px solid #fff;border-radius:12px}
.track{display:flex;gap:6px;overflow-x:auto;padding:8px 0;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.col{display:flex;flex-direction:column;gap:6px;min-width:80px;text-align:center}.lv{font-weight:900;color:var(--gold)}
.cell{border:3px solid var(--gold);border-radius:12px;background:radial-gradient(#3a5fa5,#1b2a5a);padding:6px 2px;font-size:11px;font-weight:700}
.cell.pr{border-color:#c084fc;background:radial-gradient(#7c3aed,#3b0764)}.cell b{display:block;font-size:26px}.cell small{display:block;font-weight:400}
.cell em{display:block;font-style:normal;font-weight:900;color:var(--y)}.cell.dn{opacity:.5}.col.lkd .cell{filter:brightness(.7)}
</style></head><body>

<section id="menu" class="scr on">
  <div class="av"><div class="avc">🤡</div><div><b>Meme Lord</b><small>🪙 <span id="gold"></span> · <span id="onl">🔴 Offline</span></small></div></div>
  <div class="date" id="dt"></div>
  <div class="lc">
    <button class="ic" onclick="pHeroes()"><i>🪖</i>Tướng</button>
    <button class="ic" onclick="pItems()"><i>⚔️</i>Trang bị</button>
    <button class="ic" onclick="pGems()"><i>💠</i>Bảng ngọc</button>
  </div>
  <div class="rp">
    <button class="ev" onclick="pEvents()">🎁 SỰ KIỆN</button>
    <div class="tr"><button onclick="pMis()">📖 SMM</button><button onclick="pGacha()">🎰 Hoạt động</button></div>
    <div class="tr"><button onclick="pLB()">🏆 BXH</button><button onclick="pTour()">🏅 Giải đấu</button></div>
  </div>
  <div class="logo"><h1>MEME<br>FIGHTER</h1><div class="prev"><i></i><i></i></div></div>
  <div class="bot">
    <div class="sw"><button onclick="startNormal()">⚔️</button><small>Đấu thường</small></div>
    <div class="rk"><div class="badge" id="bd"></div><button onclick="startRank()">RANK</button><small id="rkn"></small></div>
  </div>
</section>

<section id="pnl" class="scr"><div class="hd"><button class="btn" onclick="home()">◀</button><b id="pt"></b><small>🪙 <span id="gold2"></span></small></div><div id="pb"></div></section>

<section id="pick" class="scr"><div class="hd"><b id="pTitle"></b><small id="pInfo"></small></div><div id="pGrid"></div>
<div class="pf"><span id="pSel"></span><button class="btn big" id="pOk" onclick="pOk()"></button></div></section>

<section id="game" class="scr">
  <div id="stage"><canvas id="cv" width="800" height="450"></canvas></div>
  <button id="snd" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">🔊</button>
  <button id="pause" onclick="paused=!paused;this.textContent=paused?'▶':'⏸'">⏸</button>
  <div id="ctl">
    <button data-k="left" style="left:var(--l);bottom:var(--b);width:66px;height:66px">◀</button>
    <button data-k="right" style="left:calc(var(--l) + 74px);bottom:var(--b);width:66px;height:66px">▶</button>
    <button data-k="jump" style="left:calc(var(--l) + 37px);bottom:calc(var(--b) + 74px);width:66px;height:66px">⬆</button>
    <button data-k="atk" style="right:var(--r);bottom:var(--b);width:88px;height:88px;font-size:26px;border-color:#ffe14d">👊</button>
    <button data-k="s1" style="right:calc(var(--r) + 98px);bottom:var(--b);width:56px;height:56px">S1<span class="cd"></span></button>
    <button data-k="s2" style="right:calc(var(--r) + 90px);bottom:calc(var(--b) + 62px);width:56px;height:56px">S2<span class="cd"></span></button>
    <button data-k="s3" style="right:calc(var(--r) + 30px);bottom:calc(var(--b) + 96px);width:56px;height:56px">S3<span class="cd"></span></button>
    <button data-k="s4" style="right:calc(var(--r) + 100px);bottom:calc(var(--b) + 128px);width:66px;height:66px">ULTI</button>
    <button data-k="dg" style="right:calc(var(--r) + 172px);bottom:var(--b);width:52px;height:52px">💨<span class="cd"></span></button>
    <button data-k="gd" style="right:calc(var(--r) + 164px);bottom:calc(var(--b) + 58px);width:52px;height:52px">🛡️</button>
  </div>
  <div id="ult"><div id="ultT"></div></div>
  <div class="modal" id="mEnd"><div class="box"><h2 id="eT"></h2><p id="eP"></p><button class="btn" id="bAgain" onclick="again()">Đấu lại</button> <button class="btn" onclick="toMenu()">Về menu</button></div></div>
</section>
<div id="rot">📱↔️<br>Xoay ngang máy để chơi nhé!</div>

<div class="modal" id="mArena"><div class="box"><h3>Chọn đấu trường</h3><div class="cards" id="cards"></div><button class="btn" onclick="$('#mArena').classList.remove('on')">Đóng</button></div></div>
<div class="modal" id="mQ"><div class="box"><p id="qt"></p><button class="btn" onclick="deq()">Hủy</button></div></div>
<div class="modal" id="mMsg"><div class="box"><p id="msg"></p><button class="btn" onclick="$('#mMsg').classList.remove('on')">OK</button></div></div>

<script src="/claude-shim.js"></script>
